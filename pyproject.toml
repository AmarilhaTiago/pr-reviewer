[project]
name = "pr-reviewer"
version = "0.1.0"
description = "LLM-powered pull request reviewer with validated structured output, cost control and evals"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "typer>=0.12", "httpx>=0.27"]

[project.scripts]
reviewer = "reviewer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
