name: Self review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          provider: gemini
          model: ${{ vars.LLM_MODEL }}
          api-key: ${{ secrets.GEMINI_API_KEY }}
          rules-path: .reviewer/rules.md
